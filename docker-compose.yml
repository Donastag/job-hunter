services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-nexara}
      POSTGRES_USER:     ${POSTGRES_USER:-nexara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nexara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Job Hunter (Next.js) ─────────────────────────────────────────────────
  job-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexara-job-hunter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:           production
      DATABASE_URL:       ${DATABASE_URL}
      BETTER_AUTH_URL:    ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PIPELINE_CRON:      ${PIPELINE_CRON:-*/30 * * * *}
    ports:
      - "3000:3000"
    networks:
      - nexara

  # ── Command Centre (Express) ─────────────────────────────────────────────
  command-centre:
    build:
      context: ./command-centre
      dockerfile: Dockerfile
    container_name: nexara-command-centre
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:     production
      DATABASE_URL: ${DATABASE_URL}
      PORT:         4200
    ports:
      - "${TAILSCALE_IP}:4200:4200"
    networks:
      - nexara

volumes:
  postgres-data:

networks:
  nexara:
    driver: bridge
