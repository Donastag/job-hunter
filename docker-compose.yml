services:

  # ── Job Hunter (Next.js) ─────────────────────────────────────────────────
  # Public on port 3000 — Coolify's Traefik routes to it when domain is added
  job-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexara-job-hunter
    restart: unless-stopped
    environment:
      NODE_ENV:           production
      DATABASE_URL:       ${DATABASE_URL}
      NEXTAUTH_URL:       ${NEXTAUTH_URL}
      NEXTAUTH_SECRET:    ${NEXTAUTH_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PIPELINE_CRON:      ${PIPELINE_CRON:-*/30 * * * *}
    ports:
      - "3000:3000"
    networks:
      - nexara
    # Coolify Traefik labels — activate when domain is ready
    labels:
      - traefik.enable=false

  # ── Command Centre (Express) ─────────────────────────────────────────────
  # Tailscale-only: bound to VPS Tailscale IP, never exposed publicly
  command-centre:
    build:
      context: ./command-centre
      dockerfile: Dockerfile
    container_name: nexara-command-centre
    restart: unless-stopped
    environment:
      NODE_ENV:     production
      DATABASE_URL: ${DATABASE_URL}
      PORT:         4200
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:4200:4200"
    networks:
      - nexara
    labels:
      - traefik.enable=false

networks:
  nexara:
    driver: bridge
